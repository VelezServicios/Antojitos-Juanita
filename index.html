<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos Juanita</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #welcome-ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .ad-modal {
            position: relative;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .ad-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #333333;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .ad-close-btn:hover {
            color: #0077b6;
        }
        .ad-timer {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 14px;
            color: #666666;
            font-weight: bold;
            opacity: 0.2;
        }
        .ad-image-link {
            display: block;
            margin-top: 20px;
        }
        .ad-banner-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .ad-banner-img:hover {
            transform: scale(1.02);
        }
        header {
            width: 100%;
            background-color: #f0f0f0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #e0e0e0;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #0077b6;
        }
        nav a i {
            font-size: 18px;
            color: #000000;
        }
        .logo-img {
            max-width: 250px;
            height: auto;
            border-radius: 50%;
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #000000;
            text-align: center;
            word-wrap: break-word;
            line-height: 1.1;
        }
        .maps-subtitle {
            font-size: 16px;
            color: #666666;
            margin-bottom: 20px;
            display: block; 
            margin-top: 10px;
            text-align: center;
        }
        .img-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .maps-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: block;
        }
        .maps-img:hover {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .logo-img {
                max-width: 120px;
            }
            nav {
                justify-content: center;
                width: 100%;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div id="welcome-ad-overlay">
    <div class="ad-modal">
        <div class="ad-timer" id="ad-timer-text">Cierra en 8s</div>
        <button class="ad-close-btn" onclick="closeAd()">&times;</button>
        
        <a href="https://wa.me/5666140182" class="ad-image-link" target="_blank" rel="noopener noreferrer">
            <img src="VELEZ_AD.jpg" alt="Anuncio Promocional" class="ad-banner-img">
        </a>
    </div>
</div>

<header>
    <div>
        <a href="#">
            <img src="AJ_LOGO.png" alt="Logo Antojitos Juanita" class="logo-img">
        </a>
    </div>
    <nav>
        <a href="AJ_PCT.html">
            <i class="fas fa-credit-card"></i> Pago con Transferencia
        </a>
        <a href="https://wa.me/5534338228" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="#" onclick="return false;">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </nav>
</header>

<main>
    <h1>Antojitos Juanita</h1>

    <div class="img-container">
        <a href="https://search.google.com/local/writereview?placeid=ChIJrSYqFLr10YURWmrVFpbnzSk" target="_blank" rel="noopener noreferrer">
            <img src="AJ_GOOGLE.jpg" alt="Califícanos en Google Maps" class="maps-img">
        </a>
    </div>
    <div class="maps-subtitle">Haz clic en la imagen</div>
</main>

<script>
    let timeLeft = 8;
    const timerText = document.getElementById('ad-timer-text');
    const adOverlay = document.getElementById('welcome-ad-overlay');

    function closeAd() {
        adOverlay.style.opacity = '0';
        setTimeout(() => {
            adOverlay.style.display = 'none';
        }, 500);
    }

    const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            timerText.innerText = `Cierra en ${timeLeft}s`;
        } else {
            timerText.innerText = '';
            clearInterval(countdown);
            closeAd();
        }
    }, 1000);
</script>

</body>
</html>
