<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos Juanita</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #f0f0f0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #e0e0e0;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        nav a i {
            font-size: 18px;
            color: #000000;
        }
        .logo-img {
            max-width: 120px;
            height: auto;
            border-radius: 50%;
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #000000;
        }
        .maps-title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #000000;
        }
        .maps-img {
            max-width: 100%;
            border-radius: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .maps-img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="pct.html">
            <i class="fas fa-credit-card"></i> Pago
        </a>
        <a href="https://wa.me/5534338228" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="#" onclick="return false;">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </nav>
    <div>
        <img src="antojitos_juanita_logo.png" alt="Logo Antojitos Juanita" class="logo-img">
    </div>
</header>

<main>
    <h1>Antojitos Juanita</h1>

    <div class="maps-title">Califícanos en Google Maps</div>
    <a href="https://search.google.com/local/writereview?placeid=ChIJrSYqFLr10YURWmrVFpbnzSk" target="_blank" rel="noopener noreferrer">
        <img src="Antojitos Juanita logo.png" alt="Califícanos en Google Maps" class="maps-img">
    </a>
</main>

</body>
</html>
