<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos Juanita - Vélez SmartLink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #f4f4f4;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .logo-img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 25px;
            color: #333;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #0077b6;
            color: #ffffff;
            padding: 14px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-link:hover {
            background-color: #0096c7;
            transform: translateY(-2px);
        }
        .btn-disabled {
            background-color: #e0e0e0;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-disabled:hover {
            transform: none;
        }
        .btn-link i {
            font-size: 20px;
        }
        .maps-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .maps-section h2 {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
        }
        .maps-section a img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .maps-section a img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<header>
    <img src="antojitos Juanita logo.png" alt="Logo Antojitos Juanita" class="logo-img">
</header>

<div class="container">
    <h1>Antojitos Juanita</h1>

    <a href="pct.html" class="btn-link">
        <i class="fas fa-credit-card"></i>
        <span>Pago con Transferencia</span>
    </a>

    <a href="https://wa.me/5534338228" class="btn-link" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-whatsapp"></i>
        <span>WhatsApp</span>
    </a>

    <a href="#" class="btn-link btn-disabled" onclick="return false;">
        <i class="fab fa-facebook"></i>
        <span>Facebook (Pendiente)</span>
    </a>

    <div class="maps-section">
        <h2>Califícanos en Google Maps</h2>
        <a href="https://search.google.com/local/writereview?placeid=ChIJrSYqFLr10YURWmrVFpbnzSk" target="_blank" rel="noopener noreferrer">
            <img src="AJ_LOGO.jpg" alt=" Califícanos en Google Maps">
        </a>
    </div>
</div>

</body>
</html>
